name: Promote stable Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  promote:
    if: >-
      ${{
        github.event.release.prerelease == false
        && startsWith(github.event.release.tag_name, 'v')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate stable tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to promote non-stable tag '$TAG'."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Promote reviewed image to latest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/unicef/adt-studio:latest \
            "ghcr.io/unicef/adt-studio:$TAG"
